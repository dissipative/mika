# Mika's care guide — all page text, in all four languages.
#
# Every entry has the same four keys: en, es (Spain), val (Valencian, AVL
# norms) and ru. Keep the practical meaning identical in all four.
#
# Inline markup: **text** becomes bold. Nothing else is interpreted; any HTML
# is escaped. Run `python3 build.py` after editing — it fails if a language is
# missing or empty.
#
# PUBLIC PAGE: never add addresses, phone numbers, e-mails, key or door codes.

# --------------------------------------------------------------------------
# Site
# --------------------------------------------------------------------------
[site]
# Public address of the published guide. Used only for link previews
# (og:image / og:url). Change it if the repository or domain changes.
url = "https://dissipative.github.io/mika/"

# --------------------------------------------------------------------------
# Languages (order = order in the switcher)
# --------------------------------------------------------------------------
[[languages]]
code = "en"          # URL folder: /en/
html = "en"          # <html lang>
label = "English"
og = "en_GB"
match = ["en"]       # browser locales that pick this language on the root page

[[languages]]
code = "es"
html = "es-ES"
label = "Español"
og = "es_ES"
match = ["es"]

[[languages]]
code = "val"
html = "ca-ES-valencia"
label = "Valencià"
og = "ca_ES"
match = ["ca"]       # Catalan / Valencian browsers

[[languages]]
code = "ru"
html = "ru"
label = "Русский"
og = "ru_RU"
match = ["ru"]

