# Hero
# --------------------------------------------------------------------------
[hero.eyebrow]
en = "Dog-sitting guide"
es = "Guía para cuidarla"
val = "Guia per a cuidar-la"
ru = "Памятка для догситтера"

[hero.title]
en = "Meet Mika"
es = "Esta es Mika"
val = "Esta és Mika"
ru = "Это Мика"

[hero.lead]
en = "Calm and friendly, she loves people, long walks and her own bed."
es = "Tranquila y cariñosa; le encantan la gente, los paseos largos y su propia cama."
val = "Tranquil·la i afectuosa; li encanten la gent, els passejos llargs i el seu llit."
ru = "Спокойная и дружелюбная, обожает людей, долгие прогулки и свою лежанку."

[hero.alt]
en = "Mika, a white fluffy dog with a dark patch over one eye, looking up with her mouth open."
es = "Mika, una perra blanca de pelo largo con una mancha oscura sobre un ojo, mira hacia arriba con la boca abierta."
val = "Mika, una gossa blanca de pèl llarg amb una taca fosca sobre un ull, mira cap amunt amb la boca oberta."
ru = "Мика — белая пушистая собака с тёмным пятном вокруг глаза — смотрит вверх с приоткрытой пастью."

